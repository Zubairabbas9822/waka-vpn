name: Build WAKA VPN (APK & PlayStore AAB)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build_android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Auto-Generate Android Platform Files (Mobile Friendly)
        run: |
          # Back up your custom pubspec and main.dart
          cp pubspec.yaml pubspec.yaml.bak
          cp lib/main.dart main.dart.bak

          # Create full Android project scaffolding
          flutter create --project-name waka_vpn --org com.wakavpn.app --platforms android .

          # Restore your custom WAKA VPN code
          mv pubspec.yaml.bak pubspec.yaml
          mv main.dart.bak lib/main.dart

          # Set App Display Name to "WAKA VPN" & Enable Cleartext HTTP for VPNGate API
          sed -i 's/android:label="waka_vpn"/android:label="WAKA VPN"\n        android:usesCleartextTraffic="true"/g' android/app/src/main/AndroidManifest.xml

          # Ensure minSdkVersion is at least 21 for OpenVPN
          sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 21/g' android/app/build.gradle || true
          sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 21/g' android/app/build.gradle || true

      - name: Install Flutter Dependencies
        run: flutter pub get

      - name: Build Release APK
        run: flutter build apk --release

      - name: Build Google Play Store Bundle (AAB)
        run: flutter build appbundle --release

      - name: Upload Ready WAKA VPN APK
        uses: actions/upload-artifact@v4
        with:
          name: WAKA-VPN-Release-APK
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Upload Play Store AAB Bundle
        uses: actions/upload-artifact@v4
        with:
          name: WAKA-VPN-PlayStore-AAB
          path: build/app/outputs/bundle/release/app-release.aab
