name: Build WAKA VPN (APK & AAB)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build_android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Auto-Generate Android Configs
        run: |
          flutter create --project-name waka_vpn --org com.wakavpn.app --platforms android .
          # Fix Android SDK versions forcefully for OpenVPN
          sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 24/g' android/app/build.gradle || true
          sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 24/g' android/app/build.gradle || true
          echo "flutter.minSdkVersion=24" >> android/local.properties

      - name: Install Dependencies
        run: flutter pub get

      - name: Build APK Release
        run: flutter build apk --release

      - name: Upload Artifact APK
        uses: actions/upload-artifact@v4
        with:
          name: WAKA-VPN-Release-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          
